<body>
<!-- Shared site header injected by /assets/site.js -->
<div id="site-header"></div>
<div class="page-hero">
  <p class="label">The Gathering CTX</p>
  <h1 class="page-title">What is<em>happening.</em></h1>
  <p class="page-intro">From weekly worship to discipleship tracks and midweek connection here is everything coming up. There is always a next step. Always a seat at the table.</p>
</div>
<div class="events-body" id="events-root">
  <div class="ev-loading">Loading events…</div>
</div>
<!-- Shared site footer injected by /assets/site.js -->
<div id="site-footer"></div>
<script src="/assets/site.js" defer></script>
<script>
/* Events page renders from /events/data/events.json so the weekly Cowork task
   only edits words in one JSON file. Cards with an "expires" date drop off the
   day after that date, so the page never shows stale events. */
(function () {
  function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function isExpired(card){return card && card.expires && String(card.expires) < todayStr();}

  function cardHtml(c){
    var link = (c.linkHref && c.linkLabel)
      ? '<a href="'+esc(c.linkHref)+'" class="ev-link">'+esc(c.linkLabel)+'</a>' : '';
    return '<div class="event-card">' +
      (c.date ? '<div class="event-date">'+esc(c.date)+'</div>' : '') +
      '<h3>'+esc(c.title)+'</h3>' +
      (c.body ? '<p>'+esc(c.body)+'</p>' : '') +
      link + '</div>';
  }

  function render(data){
    var root = document.getElementById("events-root");
    var html = "";
    if (data.recurring) {
      html += '<div class="recurring"><h3>'+esc(data.recurring.title)+'</h3>' +
        (data.recurring.detail ? '<p>'+esc(data.recurring.detail)+'</p>' : '') + '</div>';
    }
    (data.sections||[]).forEach(function(sec){
      var cards = (sec.cards||[]).filter(function(c){return !isExpired(c);});
      if (!cards.length) return; // hide a section once all its cards have expired
      html += '<div class="event-section">' +
        (sec.label ? '<span class="section-label">'+esc(sec.label)+'</span>' : '') +
        (sec.title ? '<h2>'+esc(sec.title)+'</h2>' : '') +
        '<div class="event-cards">' + cards.map(cardHtml).join("") + '</div></div>';
    });
    root.innerHTML = html || '<p class="ev-loading">Check back soon for upcoming events.</p>';
  }

  fetch("/events/data/events.json")
    .then(function(r){ if(!r.ok) throw new Error("nf"); return r.json(); })
    .then(render)
    .catch(function(){
      document.getElementById("events-root").innerHTML =
        '<p class="ev-loading">We could not load events right now. ' +
        'Text us at (817) 518-4773 or <a href="/visit" style="color:var(--gold)">plan your visit</a>.</p>';
    });
})();
</script>
</body>
