# Kids Zone app
[[redirects]]
  from = "/kids-app"
  to = "https://kids.gatheringctx.org"
  status = 301

[[redirects]]
  from = "/kids-app/*"
  to = "https://kids.gatheringctx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

