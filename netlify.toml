[build]
  publish = "."

# Build-time asset optimization: compress images and minify CSS/JS on deploy.
# Files in the repo are untouched; Netlify serves optimized versions.
[build.processing]
  skip_processing = false
[build.processing.css]
  minify = true
[build.processing.js]
  minify = true
[build.processing.images]
  compress = true

[functions]
  directory = "netlify/functions"

# Clean URLs
[[redirects]]
  from = "/kids"
  to = "/kids.html"
  status = 200

[[redirects]]
  from = "/new-here"
  to = "/new-here.html"
