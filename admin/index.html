<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Gathering — Email Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e0e0e0;font-family:Georgia,serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px}
.container{width:100%;max-width:640px}
.brand{text-align:center;margin-bottom:48px}
.brand p{font-size:11px;letter-spacing:4px;color:#c9a84c;text-transform:uppercase;font-family:Arial,sans-serif}
.brand h1{font-size:22px;color:#f0f0f0;margin-top:8px;font-weight:normal}
.tabs{display:flex;border-bottom:1px solid #222;margin-bottom:36px}
.tab{flex:1;padding:14px;text-align:center;font-family:Arial,sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#555;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:#c9a84c;border-bottom-color:#c9a84c}
.form-panel{display:none}.form-panel.active{display:block}
.field{margin-bottom:24px}
label{display:block;font-family:Arial,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:8px}
input,textarea{width:100%;background:#111;border:1px solid #222;color:#e0e0e0;font-family:Georgia,serif;font-size:15px;padding:12px 16px;border-radius:2px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:#c9a84c}
textarea{resize:vertical;min-height:100px}
.hint{font-family:Arial,sans-serif;font-size:11px;color:#555;margin-top:6px}
.secret-row{background:#0d0d0d;border:1px solid #1a1a1a;padding:20px;margin-bottom:36px;border-radius:2px}
.btn{display:block;width:100%;background:#c9a84c;color:#000;border:none;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;padding:16px;cursor:pointer;border-radius:2px;transition:background .2s}
.btn:hover{background:#dbb85a}.btn:disabled{background:#333;color:#666;cursor:not-allowed}
.status{margin-top:20px;padding:16px;border-radius:2px;font-family:Arial,sans-serif;font-size:13px;display:none}
.status.success{background:#0d1f0d;border:1px solid #1a4a1a;color:#5cb85c;display:block}
.status.error{background:#1f0d0d;border:1px solid #4a1a1a;color:#d9534f;display:block}
.divider{border:none;border-top:1px solid #1a1a1a;margin:40px 0}
.note{font-family:Arial,sans-serif;font-size:12px;color:#444;line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="container">
<div class="brand">
<p>The Gathering CTX</p>
<h1>Email Admin</h1>
</div>
<div class="secret-row">
<div class="field" style="margin-bottom:0">
<label>Admin Secret Key</label>
<input type="password" id="adminSecret" placeholder="Enter your admin secret...">
<p class="hint">Set ADMIN_SECRET in Netlify environment variables.</p>
</div>
</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('sermons')">New Sermon</div>
<div class="tab" onclick="switchTab('devotionals')">New Devotional</div>
</div>
<div class="form-panel active" id="panel-sermons">
<div class="field"><label>Email Subject</label><input type="text" id="s-subject" placeholder="New Sermon: Ephesians Week 4"></div>
<div class="field"><label>Sermon Title</label><input type="text" id="s-title" placeholder="Walking in the Fullness"></div>
<div class="field"><label>Series (optional)</label><input type="text" id="s-series" placeholder="Ephesians Week 4"></div>
<div class="field"><label>Scripture (optional)</label><input type="text" id="s-scripture" placeholder="Ephesians 4:1-16"></div>
<div class="field"><label>Listen Link</label><input type="url" id="s-url" placeholder="https://podcasts.apple.com/..."></div>
<button class="btn" onclick="send('sermons')">Send to Sermon Subscribers</button>
<div class="status" id="status-sermons"></div>
</div>
<div class="form-panel" id="panel-devotionals">
<div class="field"><label>Email Subject</label><input type="text" id="d-subject" placeholder="New Devotional: Ephesians Week 4"></div>
<div class="field"><label>Devotional Title</label><input type="text" id="d-title" placeholder="Walking in the Fullness"></div>
<div class="field"><label>Series (optional)</label><input type="text" id="d-series" placeholder="Ephesians Week 4"></div>
<div class="field"><label>Scripture (optional)</label><input type="text" id="d-scripture" placeholder="Ephesians 4:1-16"></div>
<div class="field"><label>Opening Line (optional)</label><textarea id="d-excerpt" placeholder="A short sentence that opens the devotional..."></textarea><p class="hint">Shows as a pull quote in the email.</p></div>
<div class="field"><label>Devotional URL</label><input type="url" id="d-url" placeholder="https://gatheringctx.org/devotional-ephesians-4"></div>
<button class="btn" onclick="send('devotionals')">Send to Devotional Subscribers</button>
<div class="status" id="status-devotionals"></div>
</div>
<hr class="divider">
<p class="note">Only use this page when the content is already live on the site.<br>Emails go out immediately to everyone on that list.</p>
</div>
<script>
function switchTab(list){
  document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',(i===0&&list==='sermons')||(i===1&&list==='devotionals'));});
  document.querySelectorAll('.form-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+list).classList.add('active');
}
function setStatus(list,type,msg){const el=document.getElementById('status-'+list);el.className='status '+type;el.textContent=msg;}
async function send(list){
  const secret=document.getElementById('adminSecret').value.trim();
  if(!secret){alert('Enter your admin secret key first.');return;}
  const p=list==='sermons'?'s':'d';
  const subject=document.getElementById(p+'-subject').value.trim();
  const title=document.getElementById(p+'-title').value.trim();
  const series=document.getElementById(p+'-series')?.value.trim()||'';
  const scripture=document.getElementById(p+'-scripture')?.value.trim()||'';
  const url=document.getElementById(p+'-url').value.trim();
  const excerpt=list==='devotionals'?(document.getElementById('d-excerpt')?.value.trim()||''):'';
  if(!subject||!title||!url){alert('Subject, title, and URL are required.');return;}
  const btn=document.querySelector('#panel-'+list+' .btn');
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const res=await fetch('/api/send-announcement',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':secret},body:JSON.stringify({list,subject,title,series,scripture,url,excerpt})});
    const data=await res.json();
    if(res.ok){setStatus(list,'success','✓ Sent to '+data.group+'.');btn.textContent='✓ Sent!';}
    else{setStatus(list,'error','Error: '+data.error);btn.disabled=false;btn.textContent='Send →';}
  }catch(err){setStatus(list,'error','Network error. Try again.');btn.disabled=false;btn.textContent='Send →';}
}
</script>
</body>
</html>
