<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10131a">
<meta name="robots" content="noindex, nofollow">
<title>Gathering Notes</title>
<style>
:root{--bg:#10131a;--panel:#181d27;--panel2:#1f2532;--ink:#e8e6df;--dim:#8b93a7;--gold:#d4af6a;--line:#2a3140;--danger:#c96f6f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--ink);background:none;border:none;outline:none}
#login{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#login h1{font-size:26px;color:var(--gold);letter-spacing:.5px}
#login p{color:var(--dim);text-align:center;max-width:340px;line-height:1.5}
#login input{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:17px;width:min(340px,86vw);text-align:center}
#login button{background:var(--gold);color:#141414;border-radius:10px;padding:13px 34px;font-size:17px;font-weight:bold}
#login .err{color:var(--danger);min-height:20px}
#app{display:none;height:100dvh}
#sidebar{display:flex;flex-direction:column;width:340px;min-width:340px;border-right:1px solid var(--line);background:var(--panel);height:100%}
#topbar{display:flex;gap:8px;padding:12px;align-items:center}
#search{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px}
#newBtn{background:var(--gold);color:#141414;border-radius:9px;padding:10px 14px;font-weight:bold;font-size:15px}
#folders{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
#folders button{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:13px;color:var(--dim)}
#folders button.on{background:var(--gold);color:#141414;border-color:var(--gold);font-weight:bold}
#list{flex:1;overflow-y:auto}
.item{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.on{background:var(--panel2)}
.item .t{font-size:16px;display:flex;gap:6px;align-items:baseline}
.item .t .pin{color:var(--gold);font-size:12px}
.item .s{color:var(--dim);font-size:13px;margin-top:3px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{color:#5a6275;font-size:11.5px;margin-top:4px;font-family:system-ui}
#editor{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
#ebar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#backBtn{display:none;font-size:22px;color:var(--gold);padding:2px 8px}
#title{flex:1;font-size:20px;font-weight:bold;min-width:0}
#ebar .act{color:var(--dim);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-family:system-ui}
#ebar .act.hot{color:var(--gold);border-color:var(--gold)}
#meta{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);align-items:center;background:var(--panel)}
#folderIn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px;width:150px;font-family:system-ui}
#saved{color:var(--dim);font-size:12px;font-family:system-ui;margin-left:auto}
#body{flex:1;resize:none;padding:20px 22px;font-size:17px;line-height:1.65;background:var(--bg)}
#preview{flex:1;overflow-y:auto;padding:24px 26px;display:none;font-size:18px;line-height:1.7}
#preview h1{color:var(--gold);font-size:26px;margin:18px 0 10px}
#preview h2{color:var(--gold);font-size:22px;margin:16px 0 8px}
#preview h3{font-size:19px;margin:14px 0 6px;color:#e0c894}
#preview p{margin:10px 0}
#preview blockquote{border-left:3px solid var(--gold);padding:4px 0 4px 14px;margin:12px 0;color:#cfd4e0;font-style:italic}
#preview li{margin:6px 0 6px 22px}
#preview hr{border:none;border-top:1px solid var(--line);margin:18px 0}
#preview strong{color:#f3e9d4}
body.pulpit #preview{font-size:24px;line-height:1.8;padding:30px 8vw}
body.pulpit #sidebar,body.pulpit #meta{display:none!important}
#empty{flex:1;display:flex;align-items:center;justify-content:center;color:#3f4759;font-size:17px}
@media(max-width:760px){
  #sidebar{width:100vw;min-width:100vw;border-right:none}
  #editor{display:none;width:100vw}
  body.editing #sidebar{display:none}
  body.editing #editor{display:flex}
  #backBtn{display:block}
}
</style>  <link rel="stylesheet" href="/assets/site.css">
</head><body class="has-shell-nav">
<!-- Shared site header injected by /assets/site.js -->
<div id="site-header"></div>

<div id="login">
  <h1>Gathering Notes</h1>
  <p id="loginMsg">Enter your passphrase.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase">
  <div class="err" id="loginErr"></div>
  <button id="loginBtn">Open</button>
</div>
<div id="app">
  <div id="sidebar">
    <div id="topbar"><input id="search" placeholder="Search notes"><button id="newBtn">+ New</button></div>
    <div id="folders"></div>
    <div id="list"></div>
  </div>
  <div id="editor">
    <div id="ebar">
      <button id="backBtn"></button>
      <input id="title" placeholder="Title">
      <button class="act" id="pinBtn">Pin</button>
      <button class="act" id="prevBtn">Read</button>
      <button class="act" id="pulpitBtn">Pulpit</button>
      <button class="act" id="archBtn">Archive</button>
    </div>
    <div id="meta"><input id="folderIn" list="folderOpts" placeholder="Folder"><datalist id="folderOpts"></datalist><span id="saved"></span></div>
    <textarea id="body" placeholder="Write..."></textarea>
    <div id="preview"></div>
    <div id="empty" style="display:none">Select or create a note</div>
  </div>
</div>
<script>
const API='https://ktuapfiexhlladgkuauc.supabase.co/functions/v1/pastor-notes?api=1'
const $=id=>document.getElementById(id)
let token=localStorage.getItem('pn_token')||''
let notes=[],folders=[],cur=null,curFolder='All',dirty=false,saveTimer=null,wakeLock=null
async function api(action,data={}){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...data})})
    if(r.status===401){localStorage.removeItem('pn_token');location.reload();return{ok:false}}
    return await r.json()
  }catch(e){return{ok:false,error:'network'}}
}
function fmtDate(s){const d=new Date(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(src){
  const lines=esc(src).split('\n');let out='',inList=false
  for(let ln of lines){
    ln=ln.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>')
    if(/^### /.test(ln)){if(inList){out+='</ul>';inList=false}out+='<h3>'+ln.slice(4)+'</h3>'}
    else if(/^## /.test(ln)){if(inList){out+='</ul>';inList=false}out+='<h2>'+ln.slice(3)+'</h2>'}
    else if(/^# /.test(ln)){if(inList){out+='</ul>';inList=false}out+='<h1>'+ln.slice(2)+'</h1>'}
    else if(/^> /.test(ln)){if(inList){out+='</ul>';inList=false}out+='<blockquote>'+ln.slice(2)+'</blockquote>'}
    else if(/^(---|\*\*\*)\s*$/.test(ln)){if(inList){out+='</ul>';inList=false}out+='<hr>'}
    else if(/^[-*] /.test(ln)){if(!inList){out+='<ul>';inList=true}out+='<li>'+ln.slice(2)+'</li>'}
    else if(/^\d+\. /.test(ln)){if(!inList){out+='<ul>';inList=true}out+='<li>'+ln.replace(/^\d+\. /,'')+'</li>'}
    else if(ln.trim()===''){if(inList){out+='</ul>';inList=false}}
    else{if(inList){out+='</ul>';inList=false}out+='<p>'+ln+'</p>'}
  }
  if(inList)out+='</ul>'
  return out
}
async function login(){
  const pass=$('pass').value
  const r=await api('login',{passphrase:pass})
  if(r.ok){token=r.token;localStorage.setItem('pn_token',token);$('login').style.display='none';$('app').style.display='flex';$('empty').style.display='flex';$('body').style.display='none';load()}
  else $('loginErr').textContent=r.error==='first_run_short'?'First run: choose a passphrase of at least 8 characters.':r.error==='wrong'?'Wrong passphrase.':'Connection problem, try again.'
}
async function load(){
  const r=await api('list',{q:$('search').value,folder:curFolder})
  if(!r.ok){const c=localStorage.getItem('pn_cache');if(c){notes=JSON.parse(c);renderList()}return}
  notes=r.notes;folders=r.folders
  localStorage.setItem('pn_cache',JSON.stringify(notes.slice(0,50)))
  renderFolders();renderList()
}
function renderFolders(){
  const all=['All',...folders]
  $('folders').innerHTML=all.map(f=>'<button class="'+(f===curFolder?'on':'')+'" data-f="'+esc(f)+'">'+esc(f)+'</button>').join('')
  document.querySelectorAll('#folders button').forEach(b=>b.onclick=()=>{curFolder=b.dataset.f;load()})
  $('folderOpts').innerHTML=folders.map(f=>'<option value="'+esc(f)+'">').join('')
}
function renderList(){
  $('list').innerHTML=notes.map(n=>'<div class="item'+(cur&&cur.id===n.id?' on':'')+'" data-id="'+n.id+'"><div class="t">'+(n.pinned?'':'')+esc(n.title)+'</div><div class="s">'+esc(n.snippet||'')+'</div><div class="m">'+esc(n.folder)+' &middot; '+fmtDate(n.updated_at)+'</div></div>').join('')||'<div style="padding:24px;color:#4a5265;text-align:center;font-size:14px">No notes yet</div>'
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openNote(el.dataset.id))
}
async function openNote(id){
  await flush()
  const r=await api('get',{id})
  let n=r.ok?r.note:null
  if(!n){const c=localStorage.getItem('pn_note_'+id);if(c)n=JSON.parse(c)}
  if(!n)return
  cur=n
  $('title').value=cur.title;$('body').value=cur.body;$('folderIn').value=cur.folder
  $('pinBtn').classList.toggle('hot',!!cur.pinned)
  $('empty').style.display='none';$('body').style.display='';showEdit(false)
  document.body.classList.add('editing')
  $('saved').textContent='';renderList()
  localStorage.setItem('pn_note_'+id,JSON.stringify(cur))
}
function markDirty(){
  if(!cur)return;dirty=true;$('saved').textContent='...'
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)
}
async function flush(){
  if(!cur||!dirty)return
  dirty=false
  const payload={id:cur.id,title:$('title').value||'Untitled',body:$('body').value,folder:$('folderIn').value||'Inbox',pinned:!!cur.pinned}
  localStorage.setItem('pn_note_'+cur.id,JSON.stringify(payload))
  const r=await api('save',payload)
  $('saved').textContent=r.ok?'Saved':'Offline, will retry'
  if(!r.ok){dirty=true;setTimeout(flush,5000)}else load()
}
function showEdit(preview){
  $('preview').style.display=preview?'block':'none'
  $('body').style.display=preview?'none':''
  if(preview)$('preview').innerHTML=md($('body').value)
  $('prevBtn').textContent=preview?'Edit':'Read'
  $('prevBtn').dataset.on=preview?'1':''
}
$('loginBtn').onclick=login
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()})
$('newBtn').onclick=async()=>{const r=await api('create',{folder:curFolder==='All'?'Inbox':curFolder});if(r.ok){await load();openNote(r.note.id)}}
$('search').addEventListener('input',()=>{clearTimeout(window._st);window._st=setTimeout(load,300)})
$('title').addEventListener('input',markDirty)
$('body').addEventListener('input',markDirty)
$('folderIn').addEventListener('input',markDirty)
$('pinBtn').onclick=()=>{if(!cur)return;cur.pinned=!cur.pinned;$('pinBtn').classList.toggle('hot',cur.pinned);dirty=true;flush()}
$('prevBtn').onclick=()=>showEdit(!$('prevBtn').dataset.on)
$('pulpitBtn').onclick=async()=>{
  const on=document.body.classList.toggle('pulpit')
  if(on){showEdit(true);try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
  else{if(wakeLock){wakeLock.release();wakeLock=null}}
}
$('archBtn').onclick=async()=>{if(!cur)return;if(!confirm('Archive this note?'))return;await api('save',{id:cur.id,archived:true});cur=null;$('empty').style.display='flex';$('body').style.display='none';$('preview').style.display='none';document.body.classList.remove('editing');load()}
$('backBtn').onclick=async()=>{await flush();document.body.classList.remove('editing','pulpit');showEdit(false)}
window.addEventListener('beforeunload',()=>{if(dirty)flush()})
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()})
if(token){$('login').style.display='none';$('app').style.display='flex';$('empty').style.display='flex';$('body').style.display='none';load()}
else{$('loginMsg').textContent='Enter your passphrase. First visit? The passphrase you enter becomes THE passphrase (8+ characters).'}
</script>
<!-- Shared site footer injected by /assets/site.js -->
<div id="site-footer"></div>
<script src="/assets/site.js" defer></script>
</body></html>
