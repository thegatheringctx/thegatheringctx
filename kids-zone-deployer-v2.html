function log(msg,cls=''){document.getElementById('log').innerHTML+=`<div class="${cls}">${msg}</div>`;}
function badge(id,cls,txt){const el=document.getElementById(id);el.className='badge '+cls;el.textContent=txt;}
async function ghReq(method,path,body){
  const res=await fetch(API+path,{method,headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const data=await res.json();
  if(!res.ok)throw new Error(data.message||res.status);
  return data;
}
async function toB64(text){
  const bytes=new TextEncoder().encode(text);
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(new Blob([bytes]));}); 
}
async function run(){
  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='Pushing...';
  document.getElementById('log').innerHTML='';
  try{
    badge('b1','running','Uploading...');
    log('Getting current file SHA...');
    let sha=null;
    try{const ex=await ghReq('GET',`/repos/${REPO}/contents/kids/index.html`);sha=ex.sha;log('Found existing file, will update');}catch(e){log('No existing file, creating new');}
    log('Pushing '+Math.round(B64.length/1024)+'KB to kids/index.html...');
    const body={message:'Update Kids Zone: reorder admin tabs, add scroll indicator',content:B64};
    if(sha)body.sha=sha;
    await ghReq('PUT',`/repos/${REPO}/contents/kids/index.html`,body);
    log('<span class="ok">✓ kids/index.html pushed!</span>');
    badge('b1','done','Done ✓');
    badge('b2','running','Deploying...');
    log('Netlify is building... usually 20-30 seconds.');
    await new Promise(r=>setTimeout(r,25000));
    badge('b2','done','Done ✓');
    log('<span class="hi">All done! Refresh gatheringctx.org/kids to see the update.</span>');
    btn.textContent='Deployed!';btn.style.background='#34d399';btn.style.color='#0f0a2e';
  }catch(e){
    log('<span class="er">Error: '+e.message+'</span>');
    badge('b1','fail','Error');
    btn.disabled=false;btn.textContent='Retry';
  }
}
</script>
