<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Resetting Warrior Zone…</title>
<style>
  html,body{height:100%;margin:0}
  body{background:radial-gradient(circle at 50% 30%,#241056,#08041e);color:#fff;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center}
  .box{max-width:340px;padding:1.5rem}
  h1{font-size:1.3rem;margin:.2rem 0 .6rem;color:#f5c842}
  p{font-size:.95rem;line-height:1.5;color:#e9e6ff;margin:.3rem 0}
  .spin{width:38px;height:38px;margin:1rem auto;border:4px solid rgba(255,255,255,.2);
        border-top-color:#f5c842;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>Resetting the app…</h1>
  <p>Clearing the old version and loading the newest one. This takes a few seconds.</p>
  <p id="msg" style="font-size:.8rem;color:rgba(255,255,255,.55)"></p>
</div>
<script>
(function(){
  var msg=document.getElementById('msg');
  function say(t){ try{ msg.textContent=t; }catch(e){} }

  // 1) Tell any running service worker to self-destruct, then unregister them all.
  function killSW(){
    if(!('serviceWorker' in navigator)) return Promise.resolve();
    return navigator.serviceWorker.getRegistrations().then(function(regs){
      (regs||[]).forEach(function(r){
        try{ if(r.active) r.active.postMessage('wz-kill'); }catch(e){}
      });
      return Promise.all((regs||[]).map(function(r){ return r.unregister().catch(function(){}); }));
    }).catch(function(){});
  }

  // 2) Delete every Cache Storage bucket (the app shell + assets).
  function killCaches(){
    if(!('caches' in window)) return Promise.resolve();
    return caches.keys().then(function(keys){
      return Promise.all((keys||[]).map(function(k){ return caches.delete(k).catch(function(){}); }));
    }).catch(function(){});
  }

  // 3) Clear the app's saved localStorage keys (kids stay on the server; this is just cache).
  function killStorage(){
    try{
      ['kgz_devo-47','kgz_devo-812','kgz_app_ver'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
      var keys=Object.keys(localStorage);
      keys.forEach(function(k){ if(k.indexOf('kgz_')===0) { try{ localStorage.removeItem(k); }catch(e){} } });
    }catch(e){}
    return Promise.resolve();
  }

  function done(){
    say('Done — loading the fresh app…');
    // Cache-bust the reload so the browser fetches a brand-new copy.
    setTimeout(function(){ window.location.replace('./?fresh=' + Date.now()); }, 400);
  }

  say('Removing the old app…');
  // Run all three, but never hang: hard fallback redirect after 6s no matter what.
  var fallback=setTimeout(done, 6000);
  Promise.all([killSW(), killCaches(), killStorage()]).then(function(){
    clearTimeout(fallback);
    done();
  }).catch(function(){ clearTimeout(fallback); done(); });
})();
</script>
</body>
</html>
